<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="description" content="야간 경기장에서 즐기는 11대11 3D 축구. 휴대폰 가로 모드 전용.">
<title>Floodlight Eleven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  /* Layout: full-bleed floodlit stadium canvas; broadcast HUD pinned to the top corners; thumb controls hug bottom-left and bottom-right */
  --night:#060a12;
  --glass:rgba(8,13,23,.8);
  --glass-hi:rgba(255,255,255,.08);
  --rule:rgba(255,255,255,.14);
  --ink:#f2f4f7;
  --mute:#94a1b5;
  --flood:#ffd447;
  --turf:#2f8a40;
  --alert:#ff4458;
  --f-num:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sl:max(16px, env(safe-area-inset-left,0px));
  --sr:max(16px, env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px);
  --sbm:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--flood);outline-offset:2px}

/* ---------- broadcast HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
#sb{position:absolute;top:calc(10px + var(--st));left:var(--sl);display:flex;align-items:stretch;height:30px;font-family:var(--f-num);font-weight:700;letter-spacing:.04em;box-shadow:0 6px 18px rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
#sb .t{display:flex;align-items:center;gap:6px;padding:0 9px;background:var(--glass);font-size:17px}
#sb .kit{width:5px;height:18px;border-radius:1px}
#sb .s{display:flex;align-items:center;gap:6px;padding:0 10px;background:#f2f4f7;color:#0b1220;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
#sb .s i{font-style:normal;opacity:.45;font-size:15px}
#sb .c{display:flex;align-items:center;padding:0 9px;background:var(--flood);color:#16120a;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;min-width:50px;justify-content:center}
#sb .h{display:flex;align-items:center;padding:0 7px;background:var(--glass);color:var(--mute);font-size:13px}
#mini{position:absolute;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);width:132px;height:86px;border-radius:4px;background:rgba(8,13,23,.55);box-shadow:0 0 0 1px var(--rule)}
#tr{position:absolute;top:calc(8px + var(--st));right:var(--sr);display:flex;gap:8px;pointer-events:auto}
.ib{width:38px;height:34px;border-radius:6px;border:1px solid var(--rule);background:var(--glass);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.06em;padding:0}
.ib svg{width:16px;height:16px;fill:var(--ink)}
#tag{position:absolute;left:var(--sl);top:calc(46px + var(--st));display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--glass);font-size:13px;white-space:nowrap;box-shadow:0 0 0 1px var(--rule)}
#tag .no{font-family:var(--f-num);font-weight:800;font-size:15px;background:var(--flood);color:#16120a;border-radius:999px;min-width:26px;height:22px;display:grid;place-items:center;padding:0 5px}
#tag .pos{font-family:var(--f-num);color:var(--mute);letter-spacing:.08em;font-size:13px}
#tag .sta{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#tag .sta b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5be37d,#d6f35a);transform-origin:left}
#say{position:absolute;left:50%;bottom:calc(10px + var(--sbm));transform:translateX(-50%);padding:6px 14px;border-radius:6px;background:rgba(8,13,23,.72);font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .25s}
#say.on{opacity:1}
#hint{position:absolute;left:50%;top:calc(104px + var(--st));transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(255,212,71,.92);color:#16120a;font-weight:700;font-size:13px;white-space:nowrap}
#power{position:absolute;width:64px;height:8px;margin-left:-32px;border-radius:4px;background:rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(255,255,255,.35);overflow:hidden}
#power b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe36b 0%,#ffb020 70%,#ff4458 92%)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#banner.on{opacity:1;transform:scale(1)}
#banner .big{font-family:var(--f-num);font-weight:800;font-style:italic;font-size:clamp(54px,13vh,110px);line-height:.9;letter-spacing:.02em;color:var(--flood);text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(255,212,71,.35)}
#banner .sub{margin-top:8px;font-size:clamp(14px,3.6vh,20px);font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#lbT,#lbB{position:absolute;left:0;right:0;height:0;background:#000;transition:height .4s}
#lbT{top:0}#lbB{bottom:0}
.replay #lbT,.replay #lbB{height:9vh}
.replay #ctl,.replay #tag,.replay #mini,.replay #say{display:none}
#rpTag{position:absolute;top:calc(9vh + 10px);right:var(--sr);font-family:var(--f-num);font-weight:800;font-style:italic;letter-spacing:.12em;font-size:18px;color:var(--ink);background:var(--alert);padding:3px 12px;border-radius:3px}
#rpSkip{position:absolute;bottom:calc(9vh + 10px);right:var(--sr);font-size:12px;color:var(--mute)}

/* ---------- touch controls ---------- */
#ctl{position:absolute;inset:0;pointer-events:none}
#stickArea{position:absolute;left:0;top:30%;bottom:0;width:46%;pointer-events:auto}
#stick{position:absolute;left:calc(var(--sl) + 18px);bottom:calc(18px + var(--sbm));width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05) 0 55%,rgba(255,255,255,.12) 56% 58%,rgba(255,255,255,.04) 59%);box-shadow:0 0 0 1.5px rgba(255,255,255,.28);opacity:.7;transition:opacity .15s;pointer-events:none}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0,#dfe5ee 40%,#9aa6b8 100%);box-shadow:0 4px 12px rgba(0,0,0,.45)}
#pad{position:absolute;right:var(--sr);bottom:calc(8px + var(--sbm));width:190px;height:184px;pointer-events:none}
.bt{position:absolute;border-radius:50%;border:none;pointer-events:auto;display:grid;place-items:center;align-content:center;gap:0;padding:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),rgba(255,255,255,.06) 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:transform .06s}
.bt b{font-size:15px;font-weight:900;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bt small{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;opacity:.7}
.bt.on{transform:scale(.92);background:radial-gradient(circle at 50% 30%,rgba(255,212,71,.65),rgba(255,212,71,.2) 70%)}
#bShoot{right:4px;bottom:6px;width:86px;height:86px;background:radial-gradient(circle at 50% 30%,rgba(255,92,108,.55),rgba(255,68,88,.18) 72%);box-shadow:inset 0 0 0 2px rgba(255,140,150,.7),0 6px 16px rgba(0,0,0,.35)}
#bShoot b{font-size:19px}
#bPass{right:100px;bottom:0;width:68px;height:68px}
#bThru{right:12px;bottom:104px;width:62px;height:62px}
#bSprint{right:96px;bottom:84px;width:58px;height:58px}
.def #bShoot{background:radial-gradient(circle at 50% 30%,rgba(90,170,255,.55),rgba(60,140,255,.18) 72%);box-shadow:inset 0 0 0 2px rgba(140,190,255,.7),0 6px 16px rgba(0,0,0,.35)}
.nokeys .keyhint{display:none}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;padding-top:var(--st);padding-bottom:var(--sbm);padding-left:var(--sl);padding-right:var(--sr);box-sizing:border-box}
.ov[hidden]{display:none!important}
#menu{background:linear-gradient(90deg,rgba(4,7,13,.92) 0%,rgba(4,7,13,.72) 42%,rgba(4,7,13,.35) 100%);place-items:stretch;overflow:auto}
.m-wrap{display:grid;grid-template-columns:minmax(220px,0.9fr) minmax(0,1.3fr);gap:clamp(16px,4vw,48px);align-items:center;max-width:980px;width:100%;margin:auto;padding-block:14px;box-sizing:border-box}
.brand{font-family:var(--f-num);font-weight:800;font-style:italic;line-height:.82;letter-spacing:.01em}
.brand .a{display:block;font-size:clamp(34px,8.5vh,64px);color:var(--ink)}
.brand .b{display:block;font-size:clamp(46px,12vh,92px);color:var(--flood);text-shadow:0 0 34px rgba(255,212,71,.28)}
.tagline{margin:10px 0 0;color:var(--mute);font-size:13px;letter-spacing:.02em}
.go{margin-top:clamp(12px,3.5vh,26px);display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border:none;border-radius:6px;background:var(--flood);color:#16120a;font-weight:900;font-size:18px;letter-spacing:.04em;box-shadow:0 10px 24px rgba(255,212,71,.22);cursor:pointer}
.go svg{width:14px;height:14px;fill:#16120a}
.rec{margin:12px 0 0;font-family:var(--f-num);font-size:15px;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.help{margin:6px 0 0;color:var(--mute);font-size:12px;line-height:1.55;max-width:34ch}
.m-right{display:grid;gap:clamp(8px,2.2vh,14px);min-width:0;background:rgba(8,13,23,.6);border:1px solid var(--rule);border-radius:10px;padding:clamp(10px,2.4vh,16px)}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:10px}
.row>label{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.clubs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.clubs::-webkit-scrollbar{display:none}
.club{flex:0 0 auto;display:grid;justify-items:center;gap:3px;width:62px;padding:6px 2px 5px;border-radius:8px;border:1px solid transparent;background:var(--glass-hi);cursor:pointer}
.club[aria-pressed="true"]{border-color:var(--flood);background:rgba(255,212,71,.12)}
.club[disabled]{opacity:.28;cursor:not-allowed}
.crest{width:28px;height:32px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:10px;letter-spacing:.04em}
.club span{font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.06em}
.club em{font-style:normal;font-size:10px;color:var(--mute);font-family:var(--f-num)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;padding:8px 6px;border-radius:6px;border:1px solid transparent;background:var(--glass-hi);font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--flood);color:var(--flood);background:rgba(255,212,71,.1)}
.vs{font-size:12px;color:var(--mute);margin:0;display:flex;justify-content:space-between;gap:8px}
.vs b{color:var(--ink);font-weight:700}

.card{background:rgba(8,13,23,.92);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;display:grid;gap:8px;min-width:240px;max-height:calc(100% - 20px);overflow:auto;box-sizing:border-box}
.card h2{margin:0 0 4px;font-family:var(--f-num);font-weight:800;font-style:italic;font-size:30px;letter-spacing:.04em;color:var(--flood)}
.card button{padding:10px 14px;border-radius:7px;border:1px solid var(--rule);background:var(--glass-hi);font-size:14px;font-weight:700;text-align:left;cursor:pointer}
.card button.pri{background:var(--flood);color:#16120a;border-color:transparent;text-align:center}
#result .card{min-width:min(520px,100%);gap:10px}
.r-k{margin:0;font-family:var(--f-num);font-weight:800;font-style:italic;letter-spacing:.14em;color:var(--flood);font-size:18px;text-align:center}
.r-sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.r-sc .n{font-weight:700;font-size:14px}
.r-sc .n:first-child{text-align:right}
.r-sc .v{font-family:var(--f-num);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.r-msg{margin:0;text-align:center;color:var(--mute);font-size:13px}
#rStats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#rStats td{padding:4px 6px;font-size:13px;border-top:1px solid var(--rule)}
#rStats td:first-child{text-align:right;font-family:var(--f-num);font-weight:700;font-size:16px;width:30%}
#rStats td:nth-child(2){text-align:center;color:var(--mute)}
#rStats td:last-child{text-align:left;font-family:var(--f-num);font-weight:700;font-size:16px;width:30%}
.r-b{display:flex;gap:8px}
.r-b button{flex:1;text-align:center}
#rotate{background:var(--night);text-align:center;align-content:center;gap:14px}
#rotate p{margin:0;font-size:16px;font-weight:700}
#rotate .ph{width:44px;height:74px;border:3px solid var(--ink);border-radius:9px;margin:0 auto;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
#rotate button{padding:8px 14px;border-radius:7px;border:1px solid var(--rule);background:transparent;color:var(--mute);font-size:13px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--night);font-family:var(--f-num);letter-spacing:.2em;color:var(--mute);font-size:14px}
@media (max-height:420px){
  .m-wrap{grid-template-columns:minmax(200px,0.85fr) minmax(0,1.35fr);padding-block:8px}
  .help{display:none}
  .club{width:56px;padding:4px 2px}
  .seg button{padding:6px 4px}
}
@media (max-width:640px) and (orientation:portrait){
  .m-wrap{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  #banner{transition:none}
  #rotate .ph{animation:none}
}
</style>

</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud" hidden>
    <div id="sb">
      <div class="t"><span class="kit" id="kH"></span><span id="nH">SNH</span></div>
      <div class="s"><span id="sH">0</span><i>:</i><span id="sA">0</span></div>
      <div class="t"><span id="nA">BMF</span><span class="kit" id="kA"></span></div>
      <div class="c" id="clk">00:00</div>
      <div class="h" id="hlf">전반</div>
    </div>
    <canvas id="mini" width="264" height="172"></canvas>
    <div id="tr">
      <button class="ib" id="camBtn" aria-label="카메라 전환">CAM</button>
      <button class="ib" id="pauseBtn" aria-label="일시정지"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
    </div>
    <div id="hint" hidden></div>
    <div id="power" hidden><b></b></div>
    <div id="say"></div>
    <div id="tag"><span class="no" id="tNo">9</span><span id="tNm">-</span><span class="pos" id="tPos">ST</span><span class="sta"><b id="tSta"></b></span></div>
    <div id="banner"><div class="big" id="bBig">GOAL</div><div class="sub" id="bSub"></div></div>
    <div id="lbT"></div><div id="lbB"></div>
    <div id="rpTag" hidden>REPLAY</div>
    <div id="rpSkip" hidden>화면을 눌러 건너뛰기</div>
    <div id="ctl">
      <div id="stickArea"></div>
      <div id="stick"><div id="knob"></div></div>
      <div id="pad">
        <button class="bt" id="bShoot" data-k="shoot"><b>슛</b><small class="keyhint">L</small></button>
        <button class="bt" id="bPass" data-k="pass"><b>패스</b><small class="keyhint">J</small></button>
        <button class="bt" id="bThru" data-k="thru"><b>스루</b><small class="keyhint">K</small></button>
        <button class="bt" id="bSprint" data-k="sprint"><b>질주</b><small class="keyhint">SHIFT</small></button>
      </div>
    </div>
  </div>

  <section id="menu" class="ov">
    <div class="m-wrap">
      <div class="m-left">
        <div class="brand"><span class="a">FLOODLIGHT</span><span class="b">ELEVEN</span></div>
        <p class="tagline">야간 리그 · 11 대 11 솔로 매치</p>
        <button class="go" id="goBtn"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>킥오프</button>
        <p class="rec" id="rec">전적 0승 0무 0패</p>
        <p class="help" id="help">왼쪽 조이스틱으로 이동, 오른쪽 버튼으로 패스·스루·슛·질주. 슛은 길게 눌러 파워를 모읍니다. 수비 때는 패스가 선수 교체(흰 화살표 선수로), 슛이 태클로 바뀝니다.</p>
      </div>
      <div class="m-right">
        <div class="row"><label>내 팀</label><div class="clubs" id="clubH"></div></div>
        <div class="row"><label>상대 팀</label><div class="clubs" id="clubA"></div></div>
        <div class="row"><label>난이도</label><div class="seg" id="segD"></div></div>
        <div class="row"><label>경기 시간</label><div class="seg" id="segL"></div></div>
        <p class="vs" id="vsLine"></p>
      </div>
    </div>
  </section>

  <section id="pause" class="ov" hidden>
    <div class="card">
      <h2>PAUSE</h2>
      <button class="pri" data-a="resume">계속하기</button>
      <button data-a="cam" id="pCam">카메라: 방송</button>
      <button data-a="stick" id="pStk">조이스틱: 고정</button>
      <button data-a="snd" id="pSnd">사운드: 켜짐</button>
      <button data-a="restart">경기 다시 시작</button>
      <button data-a="menu">메인 메뉴로</button>
    </div>
  </section>

  <section id="result" class="ov" hidden>
    <div class="card">
      <p class="r-k" id="rK">HALF TIME</p>
      <div class="r-sc"><span class="n" id="rH">-</span><span class="v" id="rV">0 : 0</span><span class="n" id="rA">-</span></div>
      <p class="r-msg" id="rMsg"></p>
      <table id="rStats"></table>
      <div class="r-b"><button class="pri" id="rMain">후반전 시작</button><button id="rAlt">메인 메뉴</button></div>
    </div>
  </section>

  <section id="rotate" class="ov" hidden>
    <div class="ph"></div>
    <p>휴대폰을 가로로 돌려주세요</p>
    <button id="rotSkip">이대로 계속</button>
  </section>

  <div id="loading">LOADING STADIUM</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('loading').textContent='3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.';return;}

/* ================= constants & helpers ================= */
const PI=Math.PI,TAU=PI*2;
const HL=52.5,HW=34,GW=7.32,GH=2.44,BR=0.11,GRAV=9.81,BVIS=1.8;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*Math.random());};

const GOALS=[];
{
  const postM=new THREE.MeshLambertMaterial({color:C3('#ffffff'),emissive:C3('#2a2a2a')});
  const frameM=new THREE.MeshLambertMaterial({color:C3('#b9bec4')});
  const netTex=ctex(128,128,(g,w,h)=>{g.clearRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,0.9)';g.lineWidth=2.2;for(let i=0;i<=w;i+=16){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}},true);
  const netM=new THREE.MeshLambertMaterial({map:netTex,transparent:true,side:THREE.DoubleSide,depthWrite:false,alphaTest:0.04,opacity:.85});
  const bar=(a,b,r,m)=>{const d=new THREE.Vector3().subVectors(b,a);const L=d.length();const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,8),m);c.position.copy(a).addScaledVector(d,0.5);c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());S.add(c);return c;};
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const TOPD=1.0,BOTD=2.3,CELL=0.96;
  for(const s of[-1,1]){
    const gx=s*HL,r=0.06;
    bar(V(gx,0,-GW/2),V(gx,GH+r,-GW/2),r,postM);bar(V(gx,0,GW/2),V(gx,GH+r,GW/2),r,postM);
    bar(V(gx,GH,-GW/2-r),V(gx,GH,GW/2+r),r,postM);
    for(const zz of[-GW/2,GW/2]){
      bar(V(gx,GH,zz),V(gx+s*TOPD,GH,zz),0.025,frameM);
      bar(V(gx+s*TOPD,GH,zz),V(gx+s*BOTD,0.02,zz),0.025,frameM);
      bar(V(gx,0.02,zz),V(gx+s*BOTD,0.02,zz),0.025,frameM);
    }
    bar(V(gx+s*TOPD,GH,-GW/2),V(gx+s*TOPD,GH,GW/2),0.025,frameM);
    bar(V(gx+s*BOTD,0.02,-GW/2),V(gx+s*BOTD,0.02,GW/2),0.025,frameM);
    // back net grid
    const NZ=20,NY=10,slope=hyp(BOTD-TOPD,GH);
    const pos=new Float32Array((NZ+1)*(NY+1)*3),uv=new Float32Array((NZ+1)*(NY+1)*2),idx=[];
    for(let j=0;j<=NY;j++)for(let i=0;i<=NZ;i++){
      const k=j*(NZ+1)+i,t=j/NY,z=-GW/2+GW*i/NZ;
      pos[k*3]=gx+s*(TOPD+(BOTD-TOPD)*t);pos[k*3+1]=GH*(1-t);pos[k*3+2]=z;
      uv[k*2]=(z+GW/2)/CELL;uv[k*2+1]=t*slope/CELL;
      if(i<NZ&&j<NY){const a=k,b=k+1,c=k+NZ+1,d=k+NZ+2;idx.push(a,c,b,b,c,d);}
    }
    const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(pos,3));bg.setAttribute('uv',new THREE.BufferAttribute(uv,2));bg.setIndex(idx);bg.computeVertexNormals();
    S.add(new THREE.Mesh(bg,netM));
    // top + sides
    const quad=(pts,uvs)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uvs),2));g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();S.add(new THREE.Mesh(g,netM));};
    quad([gx,GH,-GW/2, gx+s*TOPD,GH,-GW/2, gx+s*TOPD,GH,GW/2, gx,GH,GW/2],[0,0,TOPD/CELL,0,TOPD/CELL,GW/CELL,0,GW/CELL]);
    for(const zz of[-GW/2,GW/2])quad([gx,0,zz, gx,GH,zz, gx+s*TOPD,GH,zz, gx+s*BOTD,0,zz],[0,0,0,GH/CELL,TOPD/CELL,GH/CELL,BOTD/CELL,0]);
    GOALS.push({s,geo:bg,base:pos.slice(),amp:0,bz:0,by:0,t:0,NZ,NY});
  }
  // corner flags
  window.__flags=[];
  const flagM=new THREE.MeshLambertMaterial({color:C3('#ffd447'),side:THREE.DoubleSide});
  const poleM=new THREE.MeshLambertMaterial({color:C3('#f2f2f2')});
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1.5,6),poleM);p.position.set(sx*HL,0.75,sz*HW);S.add(p);
    const f=new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.3),flagM);f.geometry.translate(0.21,0,0);f.position.set(sx*HL,1.35,sz*HW);S.add(f);window.__flags.push(f);
  }
}

/* stadium stands, crowd, roof */
const CROWD={a:null,b:null,mats:[]};
function crowdTextures(homeHex,awayHex){
  const rr=seeded(77),people=[];
  const W=1024,H=512,rowH=25.6,colW=16;
  for(let r=0;r<20;r++)for(let c=0;c<64;c++){
    if(c%32===0||c%32===1)continue;
    const q=rr();if(q<0.05)continue;
    const k=rr();
    const col=k<0.5?homeHex:k<0.66?awayHex:k<0.78?'#e9e9e9':k<0.9?'#20242c':['#3a5a9a','#9a3a3a','#e0b030','#3a8a5a','#6a4a8a'][Math.floor(rr()*5)];
    const sk=['#e8c09a','#d4a27a','#b07a52','#7a5038'][Math.floor(rr()*4)];
    people.push({x:c*colW+colW/2+(rr()-0.5)*3,y:r*rowH+rowH*0.62,col,sk,j:rr()<0.55,arm:rr()<0.4});
  }
  const draw=(jump)=>ctex(W,H,(g)=>{
    g.fillStyle='#161a22';g.fillRect(0,0,W,H);
    for(let r=0;r<20;r++){g.fillStyle='#1f2531';g.fillRect(0,r*rowH+rowH*0.72,W,rowH*0.28);}
    g.fillStyle='#4a4f5a';for(const x of[0,512])g.fillRect(x,0,32,H);
    g.fillStyle='rgba(0,0,0,.25)';for(const x of[0,512])for(let r=0;r<20;r++)g.fillRect(x,r*rowH+rowH*0.5,32,2);
    for(const p of people){
      const dy=(jump&&p.j)?-5:0;
      g.fillStyle=p.col;g.fillRect(p.x-5.5,p.y-7+dy,11,11);
      g.fillStyle=p.sk;g.beginPath();g.arc(p.x,p.y-10.5+dy,3.6,0,TAU);g.fill();
      if(jump&&p.arm){g.fillStyle=p.sk;g.fillRect(p.x-7,p.y-19+dy,2,8);g.fillRect(p.x+5,p.y-19+dy,2,8);}
    }
  },true);
  return [draw(false),draw(true)];
}
const STAND_GROUPS=[];

  const [ta,tb]=crowdTextures('#c3162f','#1b57cf');CROWD.a=ta;CROWD.b=tb;
  const concrete=new THREE.MeshLambertMaterial({color:C3('#262b35')});

  const roofM=new THREE.MeshLambertMaterial({color:C3('#1a1e26'),side:THREE.DoubleSide});
  const stripM=new THREE.MeshBasicMaterial({color:C3('#fff4d8')});
  const mk=(len,place)=>{
    const g=new THREE.Group();
    const tier=(z0,y0,z1,y1)=>{
      const L=hyp(z1-z0,y1-y0);
      const t1=CROWD.a.clone();t1.needsUpdate=true;t1.repeat.set(len/32,L/16);
      const m=new THREE.MeshLambertMaterial({map:t1,color:C3('#9a9aa0')});
      CROWD.mats.push(m);
      const pg=new THREE.PlaneGeometry(len,L);pg.rotateZ(PI);
      const p=new THREE.Mesh(pg,m);
      // tilt so the crowd faces the pitch (local -z) with heads up the slope
      p.position.set(0,(y0+y1)/2,(z0+z1)/2);p.rotation.x=-(PI/2+Math.atan2(y1-y0,z1-z0));
      g.add(p);
    };
    const wall=(z,y0,y1,m)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(len,y1-y0),m);p.position.set(0,(y0+y1)/2,z);p.rotation.y=PI;g.add(p);return p;};
    wall(0.2,0,1.3,concrete);

    const band=wall(20.4,11,14.6,null);band.material=new THREE.MeshBasicMaterial({map:null,color:C3('#0c0f15')});BAND_MESHES.push({m:band,len});
    tier(21,14.6,44,32);
    wall(44.4,0,36,darkM);
    const roof=new THREE.Mesh(new THREE.PlaneGeometry(len,40),roofM);roof.rotation.x=-PI/2+0.08;roof.position.set(0,37.5,30);g.add(roof);
    const strip=new THREE.Mesh(new THREE.PlaneGeometry(len*0.96,0.5),stripM);strip.position.set(0,36.6,10.4);strip.rotation.x=PI/2-0.3;g.add(strip);
    const fascia=new THREE.Mesh(new THREE.BoxGeometry(len,1.6,0.4),darkM);fascia.position.set(0,37.4,10);g.add(fascia);
    place(g);S.add(g);STAND_GROUPS.push(g);
  };
  mk(2*(HL+46),g=>{g.rotation.y=PI;g.position.set(0,0,-(HW+6.5));});
  mk(2*(HL+46),g=>{g.position.set(0,0,HW+6.5);});

}

/* pose: a locomotion layer (stride, shuffle, stance, lean, head) blended with an action layer */
const BX=0,BY=1,BZ=2,TL=3,TR=4,KL=5,KR=6,ALX=7,ARX=8,ALZ=9,ARZ=10,EL=11,ER=12,HLZ=13,HRZ=14,HY=15,HX=16,NCH=17;
const PZ=new Float32Array(NCH),PA=new Float32Array(NCH);
const easeOut=u=>1-(1-u)*(1-u),easeIO=u=>u*u*(3-2*u);
const fadeW=(t,end,fin,fout)=>clamp(Math.min(t/fin,(end-t)/fout),0,1);
function actEnd(e){
  switch(e.act){
    case ACT.KICK:return(e.ap1||0.1)+0.44;
    case ACT.DIVE:return Math.max(0.16,e.ap3||0.3)+1.7;
    case ACT.THROW:return e.ap2>0?e.ap2+0.5:99;
    case ACT.HOLD:case ACT.CELEB:return 99;
    default:return ACT_LIM[e.act]||0.5;
  }
}
function locoPose(e,P,dt){
  const fx=Math.sin(e.face),fz=Math.cos(e.face);
  const sp=hyp(e.vx,e.vz),vf=e.vx*fx+e.vz*fz,vl=e.vx*fz-e.vz*fx;
  if(dt>0){
    const w=angD(e.pFace==null?e.face:e.pFace,e.face)/dt;e.pFace=e.face;
    e.turnV=lerp(e.turnV||0,clamp(w,-8,8),Math.min(1,dt*8));
    const acc=(sp-(e.pSp==null?sp:e.pSp))/dt;e.pSp=sp;
    e.accS=lerp(e.accS||0,clamp(acc,-12,12),Math.min(1,dt*6));
  }
  const amp=clamp(sp/8.8,0,1),mov=Math.min(1,sp/1.1);
  const sideW=sp>0.3?Math.abs(vl)/(Math.abs(vf)+Math.abs(vl)+1e-4):0,fwdW=1-sideW;
  const ph=e.phase,s=Math.sin(ph),c=Math.cos(ph);
  const bdx=B.x-e.x,bdz=B.z-e.z,bd=hyp(bdx,bdz);
  // athletic "ready" stance: keepers when play is near, defenders facing the ball carrier
  let ready=0;
  if(e.isGK)ready=clamp(1-(bd-14)/24,0,1);
  else if(e.team&&B.owner&&B.owner!==e&&B.owner.team!==e.team)ready=clamp(1-(bd-2.5)/5,0,1);
  e.rdy=lerp(e.rdy||0,ready,Math.min(1,(dt||0)*4));
  const rd=e.rdy*(1-mov*0.6);
  // stride: thigh swing grows with speed, knee folds in the swing phase
  const sw=(0.22+0.8*amp)*mov*fwdW;
  P[TL]=s*sw-rd*0.25;P[TR]=-s*sw-rd*0.25;
  const kf=(0.25+1.35*amp)*mov*fwdW;
  P[KL]=0.1+0.12*mov+rd*0.55+kf*Math.max(0,Math.sin(ph+1.9));
  P[KR]=0.1+0.12*mov+rd*0.55+kf*Math.max(0,Math.sin(ph+1.9+PI));
  // side shuffle: legs step apart and together instead of running
  const ab=0.3*sideW*mov;
  P[HLZ]=ab*Math.max(0,s)+rd*0.09;P[HRZ]=-ab*Math.max(0,-s)-rd*0.09;
  P[KL]+=sideW*mov*0.4*Math.max(0,s);P[KR]+=sideW*mov*0.4*Math.max(0,-s);
  // torso: lean with speed and acceleration, bank into turns, dip on each footfall
  P[BX]=0.03+amp*0.24*fwdW*(vf<-0.3?-0.35:1)+clamp(e.accS*0.022,-0.12,0.18)+rd*0.18;
  P[BZ]=clamp(-(e.turnV||0)*sp*0.026,-0.3,0.3);
  P[BY]=-Math.abs(c)*0.045*amp*fwdW-rd*0.05;
  // arms swing against the legs
  const as=(0.22+0.78*amp)*mov*fwdW;
  P[ALX]=-s*as-rd*0.3;P[ARX]=s*as-rd*0.3;
  const out=0.1+sideW*mov*0.32+rd*0.38;
  P[ALZ]=out;P[ARZ]=-out;
  P[EL]=P[ER]=-(0.3+1.1*amp*mov)-rd*0.55;
  if(mov<0.15){const b=Math.sin(G.t*2.1+e.i*1.3)*0.025;P[ALZ]+=b;P[ARZ]-=b;P[BX]+=b*0.3;}

function integ(s,dt){

    s.vy-=GRAV*dt;const dr=Math.exp(-0.1*dt);s.vx*=dr;s.vz*=dr;
    if(s.spin){const sp=hyp(s.vx,s.vz);if(sp>1){s.vx+=(-s.vz/sp)*s.spin*dt;s.vz+=(s.vx/sp)*s.spin*dt;}s.spin*=Math.exp(-1.0*dt);}
  }else{
    s.vy=0;s.y=BR;const sp=hyp(s.vx,s.vz);
    if(sp>0){const ns=Math.max(0,sp*Math.exp(-0.36*dt)-0.32*dt);const k=ns/sp;s.vx*=k;s.vz*=k;}
    s.spin*=Math.exp(-5*dt);
  }
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
  if(s.y<BR){s.y=BR;if(s.vy<-1.4){s.vy=-s.vy*0.52;s.vx*=0.86;s.vz*=0.86;}else s.vy=0;}
}

}
function passExec(p,r,kind,pt){
  const human=p.team.human;
  let tx,tz;
  if(pt){tx=pt.x;tz=pt.z;}
  else{
    tx=r.x;tz=r.z;
    if(kind==='through'){const lead=clamp(9-hyp(r.x-B.x,r.z-B.z)*0.05,5,9);tx=r.x+r.team.dir*lead+r.vx*0.35;tz=r.z+r.vz*0.5;}
    else{for(let it=0;it<2;it++){const d=hyp(tx-B.x,tz-B.z),T=kind==='ground'?d/19:0.6+d*0.024;tx=r.x+r.vx*T*0.8;tz=r.z+r.vz*T*0.8;}}
  }
  tx=clamp(tx,-HL+1,HL-1);tz=clamp(tz,-HW+1,HW-1);
  let dx=tx-B.x,dz=tz-B.z,d=Math.max(1,hyp(dx,dz));
  if(kind==='throw')d=Math.min(d,24);
  const [,pres]=nearestOpp(p);
  let err=(1-p.st.pass)*0.09+(human?0.02:D.passErr)+(pres<2?0.03:0)+d*0.0006;
  if(kind==='through'||kind==='cross')err*=1.2;
  const ang=Math.atan2(dx,dz)+gauss()*err*0.6;
  const lofted=kind==='lob'||kind==='cross'||kind==='throw'||(kind!=='ground'&&kind!=='through'&&d>30)||(kind==='through'&&d>30)||(kind==='ground'&&d>34);
  const dm=d*(1+gauss()*err*0.5);
  const sx=Math.sin(ang),sz=Math.cos(ang);
  if(!lofted){
    const vEnd=kind==='through'?7+dm*0.1:9+dm*0.15;
    const v=clamp(groundSpeedFor(dm,vEnd),12.5,34);
    kickBall(p,sx*v,0,sz*v,0);
  }else{
    const T=kind==='throw'?0.55+dm*0.035:kind==='cross'?0.72+dm*0.021:0.62+dm*0.024;
    const vh=dm/T*(1+0.05*T),vy=0.5*GRAV*T-(B.y-BR)/T;
    kickBall(p,sx*vh,vy,sz*vh,kind==='cross'?gauss()*1.5:0);
  }
  B.target={r,x:tx,z:tz};r.team.recv=r;
  G.stats[p.team.i].pass++;
  if(p.team.human&&r.team.human&&!r.isGK)setCtrl(r,'recv');
}
function shoot(p,power,aimZ){
  if(p.kick||B.owner!==p)return;
  p.aimFace=Math.atan2(p.team.dir*HL-p.x,(aimZ==null?0:aimZ*2.5)-p.z);
  scheduleKick(p,0.1+0.08*power,0.6+0.4*power,()=>{p.aimFace=null;shootExec(p,power,aimZ);},ACT.KICK);
}
function shootExec(p,power,aimZ){
  const dir=p.team.dir,gx=dir*HL;
  const gk=oppOf(p.team).players[0];
  let az=aimZ;
  if(az==null||Math.abs(az)<0.25){az=gk.z>B.z*0.15?-0.72:0.72;az+=rnd(-0.2,0.2);}
  const dist=hyp(gx-B.x,B.z);
  const [,pres]=nearestOpp(p);
  const errScale=(p.team.human?1:D.shoot);
  const errZ=gauss()*(0.25+(1-p.st.shoot)*1.4+dist*0.028+(pres<1.6?0.5:0))*errScale;
  const tz=clamp(az,-1,1)*(GW/2-0.45)+errZ;
  let ty=0.22+power*1.45+gauss()*0.28*(1+dist/28)*errScale;
  if(power>0.86)ty+=(power-0.86)*10;
  ty=Math.max(0.15,ty);
  const speed=14+power*18*(0.9+p.st.shoot*0.15);
  const dx=gx+dir*0.3-B.x,dz=tz-B.z,dh=hyp(dx,dz),T=dh/speed;
  const vy=(ty-B.y+0.5*GRAV*T*T)/T;
  kickBall(p,dx/dh*speed,vy,dz/dh*speed,(power<0.55?-Math.sign(dz)*2.5:gauss()*0.8));
  B.shot={by:p,t:G.t,team:p.team.i};
  G.stats[p.team.i].shots++;
  say(p.name+', 슈팅!');AU.excite(0.85);
}
function header(e){
  e.act=ACT.HEAD;e.actT=0;e.cool=0.45;e.kick=null;
  const dir=e.team.dir,gx=dir*HL,dG=hyp(gx-e.x,e.z);
  let vx,vy,vz;
  if(dG<17&&(gx-e.x)*dir>2){
    const tz=clamp(-e.z*0.25+gauss()*1.6,-GW/2+0.2,GW/2-0.2),ty=rnd(0.3,2.0),sp=rnd(12,17);
    const dx=gx+dir*0.3-B.x,dz=tz-B.z,dh=hyp(dx,dz),T=dh/sp;
    vx=dx/dh*sp;vz=dz/dh*sp;vy=(ty-B.y+0.5*GRAV*T*T)/T;
    B.owner=null;B.held=false;B.vx=vx;B.vy=vy;B.vz=vz;B.spin=0;B.last=e;B.lastTeam=e.team.i;B.kicker=e;B.kickT=G.t;B.target=null;
    B.shot={by:e,t:G.t,team:e.team.i};G.stats[e.team.i].shots++;say(e.name+'의 헤더!');AU.excite(0.9);
  }else{
    const a=(dir>0?PI/2:-PI/2)+rnd(-0.7,0.7);const sp=rnd(9,13);
    B.owner=null;B.held=false;B.vx=Math.sin(a)*sp;B.vz=Math.cos(a)*sp;B.vy=rnd(1.5,3.5);B.spin=0;B.last=e;B.lastTeam=e.team.i;B.kicker=e;B.kickT=G.t;B.shot=null;B.target=null;
  }
  sfx.kick(9);
}
function gainBall(e){
  const prevTeam=B.lastTeam,tgt=B.target,bsp=hyp(B.vx,B.vy,B.vz),by=B.y;
  B.owner=e;B.held=false;B.shot=null;B.target=null;B.vx=B.vy=B.vz=0;B.spin=0;
  if(tgt&&tgt.r.team===e.team&&B.kicker&&B.kicker.team===e.team&&B.kicker!==e)G.stats[e.team.i].passOk++;
  B.last=e;B.lastTeam=e.team.i;e.team.recv=null;e.kick=null;
  if(e.isGK&&inOwnBox(e)){
    B.held=true;e.holdT=0;
    if(e.act!==ACT.DIVE){if(by>1.55||by<0.5){e.act=ACT.CATCH;e.ap1=by;}else e.act=ACT.HOLD;e.actT=0;}
  }else if(bsp>3.5&&e.act!==ACT.SLIDE&&e.act!==ACT.HEAD&&e.act!==ACT.POKE){e.act=ACT.TRAP;e.actT=0;}
  e.decT=e.team.human?0.1:D.react*0.6+rnd(0.25,0.6);
  if(e.team.human){
    if(!e.isGK){setCtrl(e);G.lock=null;}
    else{const n=nearestHuman(e.x,e.z,true);if(n)setCtrl(n);}
  }else if(G.ctrl)autoSwitchDef(prevTeam!==e.team.i);
  if(e===G.ctrl&&G.queue&&G.t-G.queue.t<0.6){const q=G.queue;G.queue=null;doUserAction(q.kind,q.power);}
}
function inOwnBox(e){const gx=ownGoalX(e.team);return Math.abs(e.x-gx)<16.5&&Math.abs(e.z)<20.16;}
function tryTackle(d,c){
  if(!c||B.owner!==c||B.held)return false;
  const dist=hyp(B.x-d.x,B.z-d.z);
  d.act=ACT.POKE;d.actT=0;
  if(dist>1.75){d.tackleCd=0.6;return false;}
  let p=0.46+(d.st.tackle-c.st.drib)*0.9-(dist>1.2?0.12:0);
  if(d.isGK)p=0.55*d.gkSkill+0.1;
  const fx=Math.sin(c.face),fz=Math.cos(c.face),dot=((d.x-c.x)*fx+(d.z-c.z)*fz)/Math.max(0.1,hyp(d.x-c.x,d.z-c.z));
  if(dot<-0.3)p-=0.15;
  if(c.team.human&&c.sprint)p+=0.06;
  if(Math.random()<clamp(p,0.08,0.9)){
    G.stats[d.team.i].tack++;
    c.stun=0.4;c.cool=0.55;c.kick=null;c.act=ACT.STUMBLE;c.actT=0;
    if(d.isGK||Math.random()<0.55){gainBall(d);}
    else{B.owner=null;B.held=false;const a=Math.atan2(B.x-d.x,B.z-d.z)+rnd(-0.8,0.8),v=rnd(3,6);B.vx=Math.sin(a)*v;B.vz=Math.cos(a)*v;B.vy=0;B.last=d;B.lastTeam=d.team.i;B.kicker=d;B.kickT=G.t;d.cool=0.15;}
    if(Math.random()<0.5)say(d.name+', 깔끔한 태클!');
    sfx.kick(5);
    return true;
  }
  d.act=ACT.STUMBLE;d.actT=0;d.stun=0.45;d.tackleCd=1.1;
  return false;
}
function startSlide(e){
  e.act=ACT.SLIDE;e.actT=0;e.slideHit=false;e.kick=null;
  const sp=Math.max(8.5,e.speed+2);e.vx=Math.sin(e.face)*sp;e.vz=Math.cos(e.face)*sp;e.stun=0.95;
}
function slideUpdate(e,dt){
  const k=Math.exp(-2.8*dt);e.vx*=k;e.vz*=k;
  if(e.slideHit||e.actT>0.6)return;
  const fx=e.x+Math.sin(e.face)*0.75,fz=e.z+Math.cos(e.face)*0.75;

    e.slideHit=true;
    const c=B.owner;

      if(Math.random()<0.62+(e.st.tackle-c.st.drib)*0.6){c.act=ACT.FALL;c.actT=0;c.stun=1.4;c.cool=1;c.kick=null;G.stats[e.team.i].tack++;say(e.name+', 슬라이딩 태클 성공!');}
      else return;
    }else if(c)return;
    B.owner=null;const a=e.face+rnd(-0.5,0.5),v=rnd(5,9);B.vx=Math.sin(a)*v;B.vz=Math.cos(a)*v;B.vy=rnd(0,1.5);B.last=e;B.lastTeam=e.team.i;B.kicker=e;B.kickT=G.t;B.shot=null;B.target=null;sfx.kick(7);
  }else if(B.owner&&B.owner.team!==e.team&&hyp(B.owner.x-fx,B.owner.z-fz)<0.6&&!e.slideHit){e.slideHit=true;const c=B.owner;c.act=ACT.FALL;c.actT=0;c.stun=1.0;c.kick=null;}
}

/* ================= AI ================= */
function toW(t,lx,lz){return[lx*HL*t.dir,lz*HW*t.dir];}
function formTarget(e){
  const t=e.team,dir=t.dir,poss=t.inPoss;
  const bx=clamp(B.x*dir/HL,-1,1),bz=clamp(B.z*dir/HW,-1,1);
  let ax=e.base[0]+bx*0.5+(poss?0.17:-0.1);
  let az=e.base[1]*(poss?1.08:0.8)+bz*(poss?0.22:0.34);
  if(e.role==='DF')ax=clamp(ax,-0.9,poss?0.3:0.05);
  else if(e.role==='MF')ax=clamp(ax,-0.78,0.62);
  else ax=clamp(ax,-0.35,0.86);
  if(!poss&&e.role==='DF')ax=Math.min(ax,bx-0.06);
  if(e.role!=='DF'){const lim=Math.max(t.lastLine,bx)-0.012+(e.run>0?0.22:0);ax=Math.min(ax,lim);}
  return toW(t,ax,clamp(az,-0.94,0.94));
}
function teamThink(t,dt){
  const o=oppOf(t);
  t.inPoss=B.owner?B.owner.team===t:(B.lastTeam===t.i);
  let ll=-1;for(const p of o.players){if(p.isGK)continue;const v=p.x*t.dir/HL;if(v>ll)ll=v;}t.lastLine=ll;
  t.chaser=null;
  // while the thumb is steering G.ctrl the AI leaves the loose ball to the user
  const userDriven=t.human&&G.ctrl&&!G.lock;
  if(!B.owner){
    let best=null,bt=1e9;
    for(const p of t.players){
      if(p.stun>0||p.act===ACT.FALL)continue;
      if(p.isGK&&!(Math.abs(p.ipx-ownGoalX(t))<16&&Math.abs(p.ipz)<19))continue;
      if(userDriven&&p===G.ctrl)continue;
      if(p.ipt<bt){bt=p.ipt;best=p;}
    }
    if(userDriven&&G.ctrl.ipt<bt+0.35)best=null;
    t.chaser=best;
  }
  t.press1=t.press2=null;
  if(B.owner&&B.owner.team!==t){
    const c=B.owner,arr=t.players.filter(p=>!p.isGK&&p.stun<=0&&p.act!==ACT.FALL).sort((a,b)=>hyp(a.x-c.x,a.z-c.z)-hyp(b.x-c.x,b.z-c.z));
    t.press1=arr[0];t.press2=arr[1];
  }
  if(t.recv&&(B.owner||G.t-B.kickT>3.5))t.recv=null;
}
// smooth (formation) targets are low-passed and settle with hysteresis so players stop fidgeting
function setMove(e,tx,tz,sprint,smooth){
  if(smooth===undefined)smooth=true;
  if(smooth&&e.sx!=null&&hyp(tx-e.sx,tz-e.sz)<15){const k=Math.min(1,STEP*3.2);e.sx+=(tx-e.sx)*k;e.sz+=(tz-e.sz)*k;tx=e.sx;tz=e.sz;}
  else{e.sx=tx;e.sz=tz;}
  const dx=tx-e.x,dz=tz-e.z,d=hyp(dx,dz);
  if(smooth){if(e.settled){if(d>1.5)e.settled=false;}else if(d<0.4)e.settled=true;}else e.settled=false;
  if(e.settled){e.mx=e.mz=0;e.sprint=false;}
  else{
    const sp=sprint?e.vmax:(d>14?e.vmax*0.8:e.vmax*0.6);
    const want=Math.min(sp,d*1.5+0.3);
    e.mx=d>0.001?dx/d*want:0;e.mz=d>0.001?dz/d*want:0;e.sprint=sprint&&want>e.vmax*0.75;
  }
  // at a jog players keep their eyes on the ball and shuffle; only a long run turns their back
  if(!e.sprint&&B.owner!==e){
    const bx=B.x-e.x,bz=B.z-e.z,bl=hyp(bx,bz)||1,cosA=d>0.01?(dx*bx+dz*bz)/(d*bl):1;
    e.strafe=d<7||cosA>-0.25;if(e.strafe&&!e.faceTgt)e.faceTgt=B;
  }else e.strafe=false;
}
function think(e,dt){
  e.strafe=false;e.faceTgt=null;
  if(e.stun>0||e.act===ACT.SLIDE||e.act===ACT.FALL||(e.act===ACT.DIVE&&!e.save)){e.mx=e.mz=0;return;}
  const t=e.team,dir=t.dir;
  if(G.state==='goal')return celebrateThink(e);
  if(G.state==='setpiece'||G.state==='out'||G.state==='kickoff')return setpieceThink(e);
  if(e.isGK)return gkThink(e,dt);
  if(B.owner===e){if(e===G.ctrl)return;return carrierThink(e,dt);}
  if(!B.owner){
    if(t.recv===e||t.chaser===e){
      const d=hyp(e.ipx-e.x,e.ipz-e.z);setMove(e,e.ipx,e.ipz,d>1.8,false);
      if(d<1.8){e.strafe=true;e.faceTgt=B;}
      return;
    }
    const [fx,fz]=formTarget(e);setMove(e,fx,fz,hyp(fx-e.x,fz-e.z)>10);return;
  }
  if(B.owner.team===t){
    // support / runs
    if(e.run>0)e.run-=dt;
    else if((e.role==='FW'||(e.role==='MF'&&Math.random()<0.4))&&Math.random()<dt*0.45&&B.x*dir/HL>-0.3)e.run=rnd(1.8,3.2);
    let [fx,fz]=formTarget(e);
    if(e.run>0)fx=clamp(fx+dir*4,-HL+2,HL-4);
    // find space: drift away from nearest marker
    const [o,od]=nearestOpp(e);
    if(o&&od<4){fz+=Math.sign(e.z-o.z||1)*(4-od)*0.6;}
    setMove(e,fx,clamp(fz,-HW+1.5,HW-1.5),e.run>0||hyp(fx-e.x,fz-e.z)>9);return;
  }
  // defending
  const c=B.owner;
  const userClose=t.human&&G.ctrl&&G.ctrl!==e&&!G.lock&&hyp(G.ctrl.x-c.x,G.ctrl.z-c.z)<7;
  if(e===t.press1&&!userClose){
    // close down fast, then jockey goal-side facing the carrier
    const gx=ownGoalX(t),vx=gx-c.x,vz=-c.z,vl=hyp(vx,vz)||1,d=hyp(c.x-e.x,c.z-e.z);
    const off=t.human?1.5:1.15;
    setMove(e,c.x+vx/vl*off+c.vx*0.3,c.z+vz/vl*off+c.vz*0.3,d>4,false);
    if(d<4.5){e.strafe=true;e.faceTgt=c;}
    if(d<1.6&&e.tackleCd<=0&&Math.random()<dt*(t.human?0.75:D.tackle))tryTackle(e,c);
    return;
  }
  if(e===t.press2&&(!t.human?D.press2:!userClose)&&hyp(c.x-e.x,c.z-e.z)<20){
    const gx=ownGoalX(t),vx=gx-c.x,vz=-c.z,vl=hyp(vx,vz)||1;
    setMove(e,c.x+vx/vl*5,c.z+vz/vl*5,hyp(c.x-e.x,c.z-e.z)>12);if(e.strafe)e.faceTgt=c;return;
  }
  let [fx,fz]=formTarget(e);
  // marking
  if(e.role!=='FW'){
    let m=null,md=13;for(const o of oppOf(t).players){if(o.isGK||o===c)continue;const d=hyp(o.x-fx,o.z-fz);if(d<md){md=d;m=o;}}
    if(m){const gx=ownGoalX(t),vx=gx-m.x,vz=-m.z,vl=hyp(vx,vz)||1;const w=e.role==='DF'?0.6:0.42;fx=lerp(fx,m.x+vx/vl*1.6,w);fz=lerp(fz,m.z+vz/vl*1.6,w);}
  }
  setMove(e,fx,fz,hyp(fx-e.x,fz-e.z)>8);
}
function carrierThink(e,dt){
  if(e.kick)return;
  const t=e.team,dir=t.dir,gx=dir*HL;
  const dG=hyp(gx-e.x,e.z),lx=e.x*dir/HL;
  const [no,nd]=nearestOpp(e);
  e.decT-=dt;
  if(e.decT<=0){
    e.decT=D.dec*rnd(0.6,1.4);
    // shoot?
    if(dG<27&&Math.abs(e.z)<24&&(gx-e.x)*dir>3){
      const lane=laneClear(e.x,e.z,gx,clamp(-e.z*0.2,-3,3),t);
      let sc=(1-dG/30)*1.7+(lane>1.2?0.3:-0.15)+(nd<2?0.15:0);
      if(Math.random()<sc*0.85){shoot(e,clamp(0.4+dG/55+rnd(-0.05,0.12),0.4,0.84),null);return;}
    }
    // options
    let best=null,bs=-1e9,bk='ground';
    for(const m of t.players){
      if(m===e)continue;
      const dx=m.x-e.x,dz=m.z-e.z,d=hyp(dx,dz);if(d<5||d>48)continue;
      const prog=(m.x-e.x)*dir;
      const [,open]=nearestOpp(m);
      const lane=laneClear(e.x,e.z,m.x,m.z,t);
      let s=(prog>0?prog*0.1:prog*0.16)+Math.min(open,8)*0.11+Math.min(lane,4)*0.22-d*0.01+(m.isGK?-3:0)+(m.role==='FW'?0.2:0)+(m.x*dir/HL>0.55?0.35:0);
      let kind='ground';
      if(lane<1.1){if(d>16){s-=0.35;kind='lob';}else s-=1.2;}
      if(m.run>0&&m.role!=='DF'&&(m.x*dir/HL)>-0.1){s+=0.7;kind='through';}
      if(lx>0.6&&Math.abs(e.z)>15&&Math.abs(m.z)<14&&(m.x*dir/HL)>0.66){s+=0.6;kind='cross';}
      if(lx>0.35&&prog<1)s-=0.55;
      if(s>bs){bs=s;best=m;bk=kind;}
    }
    // dribble value
    let ahead=99;for(const o of oppOf(t).players){const rx=(o.x-e.x)*dir,rz=o.z-e.z;if(rx>0&&rx<9&&Math.abs(rz)<rx*0.8+1.5){const d=hyp(rx,rz);if(d<ahead)ahead=d;}}
    let ds=(ahead>8?1.75:ahead>4.5?1.0:-0.3)+(lx>0.3?0.25:0)+(dG<38&&ahead>3?0.6:0);
    if(nd<2.2)ds-=0.7;
    const urgency=nd<1.8?0.5:0;
    if(best&&bs+urgency>ds+0.15){passTo(e,best,bk);return;}
  }
  // dribble steering
  let sx=dir,sz=-e.z*0.025;
  for(const o of oppOf(t).players){const dx=e.x-o.x,dz=e.z-o.z,d=hyp(dx,dz);if(d<7&&d>0.01){const w=(7-d)/7*1.6;sx+=dx/d*w*0.6;sz+=dz/d*w;}}
  if(Math.abs(e.z)>HW-4)sz-=Math.sign(e.z)*1.5;
  const sl=hyp(sx,sz)||1;
  setMove(e,e.x+sx/sl*6,e.z+sz/sl*6,nd>2.5&&e.stamina>0.3,false);
}
function gkThink(e,dt){
  const t=e.team,gx=ownGoalX(t);
  if(B.owner===e){
    e.holdT+=dt;e.strafe=false;
    if(e.act===ACT.DIVE||e.act===ACT.CATCH){e.mx=e.mz=0;return;}
    if(!e.kick)e.aimFace=Math.atan2(t.dir,0);
    // carry the ball out a few steps before releasing it

function gkSaveStep(e){

function inOwnBoxP(t,x,z){return Math.abs(x-ownGoalX(t))<16.5&&Math.abs(z)<20.16;}

}
function doSave(e,sv){

  }else{
    const dir=e.team.dir,away=Math.sign(B.z-e.z)||Math.sign(sv&&sv.handZ!=null?sv.handZ-e.z:1)||1;

function gkDistribute(e){

/* ================= players update ================= */
// locomotion with momentum: a running player bends his path instead of snapping to a new heading,
// and has to brake before a sharp cut; shuffling and stopping use plain 2D acceleration
function locomote(e,dt){
  const user=e===G.ctrl&&!G.lock,own=B.owner===e;
  const sd=hyp(e.mx,e.mz),s=hyp(e.vx,e.vz);
  const agil=(user?1.15:1)*(0.85+0.3*(e.st?e.st.pace:0.8));
  const ACC=8.5*agil,DEC=15*agil;
  if(e.strafe||s<1.0||sd<0.25){
    let dvx=e.mx-e.vx,dvz=e.mz-e.vz;const dl=hyp(dvx,dvz),a=(sd<s?DEC:ACC)*(e.strafe?1.1:1)*dt;
    if(dl>a){dvx*=a/dl;dvz*=a/dl;}
    e.vx+=dvx;e.vz+=dvz;
  }else{
    const th=Math.atan2(e.vx,e.vz),da=angD(th,Math.atan2(e.mx,e.mz)),ad=Math.abs(da);
    const om=lerp(10,user?4.4:3.4,clamp(s/9,0,1))*(own?0.85:1);
    let tgt=sd;if(ad>2.0)tgt=Math.min(tgt,0.6);else if(ad>1.1)tgt=Math.min(tgt,s*0.7);
    const nth=th+clamp(da,-om*dt,om*dt),ns=Math.max(0,s+clamp(tgt-s,-DEC*dt,ACC*dt));
    e.vx=Math.sin(nth)*ns;e.vz=Math.cos(nth)*ns;
  }

  let cap=own?e.vmax*0.93:e.vmax;
  if(e.strafe){const s2=hyp(e.vx,e.vz);if(s2>0.1){const cf=(e.vx*Math.sin(e.face)+e.vz*Math.cos(e.face))/s2;cap*=(cf>0?1:lerp(1,0.62,-cf))*lerp(1,0.8,1-Math.abs(cf));}}

  const s3=hyp(e.vx,e.vz);if(s3>cap){e.vx*=cap/s3;e.vz*=cap/s3;}
}
function faceUpdate(e,dt,sp){
  if(e.act===ACT.SLIDE||e.act===ACT.DIVE||e.act===ACT.FALL){e.turnRate=0;return;}
  let fa=null,rate=10;
  if(e.aimFace!=null){fa=e.aimFace;rate=14;}
  else if(e.strafe&&e.faceTgt){const tx=e.faceTgt.x-e.x,tz=e.faceTgt.z-e.z;if(hyp(tx,tz)>0.3){fa=Math.atan2(tx,tz);rate=7;}}
  else if(sp>0.8){fa=Math.atan2(e.vx,e.vz);rate=B.owner===e?8:11;}
  else if(B.owner!==e){const d=hyp(B.x-e.x,B.z-e.z);if(d>0.6){fa=Math.atan2(B.x-e.x,B.z-e.z);rate=5;}}
  if(fa==null){e.turnRate=0;return;}
  const st=angD(e.face,fa)*Math.min(1,dt*rate);e.face+=st;e.turnRate=st/dt;
}
function moveEnt(e,dt){
  if(e.cool>0)e.cool-=dt;if(e.tackleCd>0)e.tackleCd-=dt;
  if(e.act){e.actT+=dt;if(e.actT>actEnd(e)){e.act=0;if(e.isGK&&B.owner===e&&B.held){e.act=ACT.HOLD;e.actT=0;}}}

  if(e.act===ACT.THROW&&B.owner!==e&&!(e.ap2>0))e.act=0;
  if(e.act===ACT.CELEB&&G.state!=='goal')e.act=0;

  if(e.act===ACT.SLIDE){slideUpdate(e,dt);if(e.stun>0)e.stun-=dt;}
  else if(e.save&&!e.save.watch){/* keeper spring: velocity is driven by gkSaveStep */}

function separate(){
  const ps=G.ents;

    const a=ps[i],b=ps[j],dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;

function refThink(r){

/* ================= ball update & rules ================= */
function updateBall(dt){
  if(B.owner){
    const o=B.owner;
    if(B.held){
      if(o.handPos&&G.t-o.handPos.t<0.25){B.x=o.handPos.x;B.y=o.handPos.y;B.z=o.handPos.z;}
      else{const thr=o.act===ACT.THROW;B.x=o.x+Math.sin(o.face)*(thr?-0.05:0.32);B.z=o.z+Math.cos(o.face)*(thr?-0.05:0.32);B.y=thr?2.25:1.12;}
      B.vx=B.vy=B.vz=0;
    }else{
      // dribbling: one touch per stride pushes the ball ahead, the runner catches up with it
      const fx=Math.sin(o.face),fz=Math.cos(o.face),sp=o.speed,cyc=((o.phase/TAU)%1+1)%1,run=Math.min(1,sp/7);
      let lead=0.42+sp*0.045+run*(0.22+(o.sprint?0.38:0.1))*Math.sin(cyc*PI),side=0.05+0.04*Math.sin(cyc*TAU);
      if(o.kick){lead=0.4;side=0.12;}

      B.x+=B.vx*dt;B.z+=B.vz*dt;B.y=BR;B.vy=0;
    }
    return;
  }
  for(let k=0;k<3;k++){integ(B,dt/3);ballCollide();}
  if(B.shot&&(hyp(B.vx,B.vz)<7||G.t-B.shot.t>3))B.shot=null;
  if(G.state!=='play')return;
  // contact
  let best=null,bd=1e9,head=null,hd=1e9;
  for(const e of G.ents){
    if(!e.team||e.cool>0||e.stun>0||e.act===ACT.SLIDE)continue;
    if(e.isGK&&e.save&&!e.save.ok)continue;
    if(e.isGK&&B.shot&&B.shot.team!==e.team.i){
      // a shot straight at the keeper's body is blocked or gathered
      if(hyp(B.x-e.x,B.z-e.z)<0.75&&B.y<1.9&&!(e.save&&e.save.done)){const sv={ok:true,catch:hyp(B.vx,B.vz)<17};if(e.act!==ACT.DIVE){e.act=ACT.CATCH;e.actT=0;e.ap1=B.y;}doSave(e,sv);return;}
      continue;
    }
    const d=hyp(B.x-e.x,B.z-e.z);
    const gkHands=e.isGK&&inOwnBox(e);
    const recv=B.target&&B.target.r===e;
    const reach=gkHands?1.3:recv?1.25:0.9,hmax=gkHands?2.6:recv?1.35:1.05;
    if(d<reach&&B.y<hmax){if(d<bd){bd=d;best=e;}}
    else if(!e.isGK&&d<0.95&&B.y>=1.05&&B.y<2.4){if(d<hd){hd=d;head=e;}}
  }
  if(best){
    const sp=hyp(B.vx,B.vy,B.vz);
    if(!best.isGK&&sp>(best.team.i===B.lastTeam?27:19)){
      // block / deflection
      B.vx=-B.vx*0.25+rnd(-3,3);B.vz=B.vz*0.3+rnd(-4,4);B.vy=Math.abs(B.vy)*0.3+rnd(0,2);
      B.last=best;B.lastTeam=best.team.i;B.kicker=best;B.kickT=G.t;B.shot=null;B.target=null;best.cool=0.3;sfx.kick(8);
      if(Math.random()<0.6)say(best.name+', 몸으로 막아냅니다!');

    }

  }

}
function checkRules(){
  if(G.state!=='play')return;
  if(Math.abs(B.x)>HL+BR){
    const s=Math.sign(B.x);
    if(Math.abs(B.z)<GW/2&&B.y<GH){const sc=G.teams.find(t=>t.dir===s);onGoal(sc.i);return;}
    const def=G.teams.find(t=>-t.dir===s),att=oppOf(def);
    if(B.lastTeam===def.i){toOut('corner',att.i,s*(HL-0.4),Math.sign(B.z)*(HW-0.4));say('코너킥입니다.');}
    else{toOut('goalkick',def.i,s*(HL-5.5),Math.sign(B.z||1)*4);say(B.shot||G.t-B.kickT<2?'골문을 벗어납니다. 골킥.':'골킥.');}
    return;
  }
  if(Math.abs(B.z)>HW+BR){toOut('throw',B.lastTeam===0?1:0,clamp(B.x,-HL+1.5,HL-1.5),Math.sign(B.z)*HW);say('스로인.');}
}
function toOut(type,ti,x,z){G.state='out';G.timer=0;G.pending={type,ti,x,z};B.shot=null;B.target=null;if(B.owner){B.owner=null;B.held=false;}}
function startSetpiece(){

function setpieceStep(dt){

function cpuSetpiece(sp){
  const tk=sp.taker,t=sp.team;

  let best=null,bs=-1e9;

    let s;

    else{if(d>24)continue;const [,open]=nearestOpp(m);s=Math.min(open,6)*0.3-d*0.04+(m.x-tk.x)*t.dir*0.03+rnd(0,0.3);}
    if(s>bs){bs=s;best=m;}}
  if(!best)best=t.players[6];
  passTo(tk,best,sp.type==='corner'?'cross':sp.type==='throw'?'throw':'ground');

const IN={jx:0,jy:0,jid:null,keys:{},btn:{pass:false,thru:false,shoot:false,sprint:false},edge:{pass:false,thru:false,shoot:false,shootUp:false},shootT:0,charging:false,power:0};
function setCtrl(e,why){

function lockActive(){
  const L=G.lock;if(!L)return false;
  const c=G.ctrl,jm=hyp(IN.jx,IN.jy),lm=hyp(L.jx,L.jy);
  if(!c||B.owner===c){G.lock=null;return false;}
  if(L.why==='recv'){if(!B.target||B.target.r!==c){G.lock=null;return false;}}
  else if(G.t-L.t>1.0){G.lock=null;return false;}
  if(jm<0.2)L.rel=true;
  else if(jm>0.35){
    if(L.rel||lm<0.2){G.lock=null;return false;}
    if((IN.jx*L.jx+IN.jy*L.jy)/(jm*lm)<0.6){G.lock=null;return false;}

function nearestHuman(x,z,noGK){let b=null,bd=1e9;for(const e of G.teams[0].players){if(noGK&&e.isGK)continue;if(e.stun>0.5)continue;const d=hyp(e.x-x,e.z-z);if(d<bd){bd=d;b=e;}}return b;}
function userMode(){
  if(G.state==='setpiece'&&G.sp&&G.sp.team.human)return'sp';

function pickTarget(c,kind){
  let dx=IN.jx,dz=IN.jy;const m=hyp(dx,dz);
  if(m<0.2){dx=Math.sin(c.face);dz=Math.cos(c.face);}else{dx/=m;dz/=m;}
  let best=null,bs=-1e9;
  for(const p of c.team.players){
    if(p===c)continue;
    const px=kind==='through'?p.x+p.team.dir*5:p.x,pz=p.z;
    const vx=px-c.x,vz=pz-c.z,d=hyp(vx,vz);if(d<2)continue;
    const cos=(vx*dx+vz*dz)/d;
    if(cos<0.35)continue;
    const [,open]=nearestOpp(p);
    const s=cos*2.6-d*0.022+Math.min(open,6)*0.04-(p.isGK?1.2:0);
    if(s>bs){bs=s;best=p;}
  }

}
function doUserAction(kind,power){
  const c=G.ctrl;if(!c||B.owner!==c||c.kick)return;
  c.aimFace=null;

    const lx=c.x/HL;
    if(lx<0.15&&hyp(HL-c.x,c.z)>42){const {best}=pickTarget(c,'lob');if(best){passTo(c,best,'lob');return;}}
    shoot(c,power,Math.abs(IN.jy)>0.3?clamp(IN.jy*1.15,-1,1):null);return;
  }
  const {best,dx,dz}=pickTarget(c,kind==='thru'?'through':'ground');
  if(!best){const v=groundSpeedFor(kind==='thru'?18:12,7);c.aimFace=Math.atan2(dx,dz);scheduleKick(c,0.09,0.4,()=>{c.aimFace=null;kickBall(c,dx*v,0,dz*v,0);},ACT.KICK);return;}
  let k=kind==='thru'?'through':'ground';
  if(k==='ground'&&c.x/HL>0.58&&Math.abs(c.z)>14&&best.x/HL>0.66&&Math.abs(best.z)<14)k='cross';
  passTo(c,best,k);
}
// defenders ranked for the switch button: closest to where the ball will be, goal-side first
function switchList(){
  const o=B.owner;let fx,fz;
  if(o){fx=o.x+o.vx*0.3;fz=o.z+o.vz*0.3;}else{const p=trajAt(0.45);fx=p.x;fz=p.z;}
  const gx=ownGoalX(G.teams[0]);
  return G.teams[0].players.filter(p=>!p.isGK&&p.stun<0.6&&p.act!==ACT.FALL)
    .map(p=>({p,s:hyp(p.x-fx,p.z-fz)+((p.x-fx)*(gx-fx)>0?-2.5:1.5)}))
    .sort((a,b)=>a.s-b.s).map(q=>q.p);
}
function switchPlayer(){

  if(G.t-G.lastManual<0.8){const i=list.indexOf(c);pick=list[(i+1)%Math.min(list.length,4)];}  // tap again: next of the best four

function autoSwitchDef(changed){

function clearEdges(){const E=IN.edge;E.pass=E.thru=E.shoot=E.shootUp=false;}
function userStep(dt){
  const c=G.ctrl;if(!c)return;
  const mode=userMode(),E=IN.edge,jm=hyp(IN.jx,IN.jy);
  // set pieces and kick-off: aim only
  if(mode==='sp'){
    const tk=G.state==='kickoff'?G.kickoffTaker:G.sp.taker;
    if(c!==tk)setCtrl(tk);
    if(G.state==='setpiece'&&(!G.sp.ready||G.sp.launched)){clearEdges();return;}
    c.mx=c.mz=0;
    if(jm>0.3)c.aimFace=Math.atan2(IN.jx,IN.jy);
    if(G.state==='kickoff'&&!G.kickReady){clearEdges();return;}
    const pressed=E.pass?'pass':E.thru?'thru':E.shoot?'shoot':null;
    clearEdges();
    if(pressed){
      const type=G.state==='kickoff'?'kickoff':G.sp.type;
      c.aimFace=null;
      if(type==='kickoff'){G.state='play';sfx.whistle(0);hideHint();const {best}=pickTarget(c,'ground');passTo(c,best||c.team.players[6],'ground');return;}
      const {best}=pickTarget(c,'ground');
      const tgt=best||c.team.players[6];
      if(type==='corner'&&pressed==='shoot')passTo(c,tgt,'cross',{x:c.team.dir*(HL-7),z:Math.sign(G.sp.z)*2});
      else passTo(c,tgt,type==='throw'?'throw':type==='corner'?(pressed==='thru'?'ground':'cross'):'ground');
      G.sp.launched=true;hideHint();
    }
    return;
  }
  if(G.state==='kickoff'){c.mx=c.mz=0;clearEdges();return;}
  if(c.stun>0||c.act===ACT.SLIDE||c.act===ACT.FALL){clearEdges();return;}
  const locked=!!G.lock;
  if(!locked){
    c.strafe=false;c.faceTgt=null;
    const press=mode==='def'&&IN.btn.thru&&B.owner&&!B.owner.team.human;
    if(press){
      // contain: stay goal-side and face the carrier
      const o=B.owner,gx=ownGoalX(c.team),vx=gx-o.x,vz=-o.z,vl=hyp(vx,vz)||1,d=hyp(o.x-c.x,o.z-c.z);
      setMove(c,o.x+vx/vl*1.2+o.vx*0.25,o.z+vz/vl*1.2+o.vz*0.25,d>3.5||IN.btn.sprint,false);
      if(d<4.5){c.strafe=true;c.faceTgt=o;}
    }else if(jm>0.05){

    }else if(!B.owner&&B.target&&B.target.r===c){setMove(c,c.ipx,c.ipz,true,false);}
    else{c.mx=c.mz=0;c.sprint=false;}
    if(c.kick&&B.held){c.mx=c.mz=0;}
  }
  if(mode==='atk'){
    if(B.owner===c){
      if(!c.kick){
        if(E.pass)doUserAction('pass');
        else if(E.thru)doUserAction('thru');
        else if(E.shootUp)doUserAction('shoot',IN.power);
      }

    if(best&&best!==c&&c.ipt>bt+0.45)setCtrl(best,'auto');
  }

}

/* ================= main step ================= */
function step(dt){
  G.t+=dt;
  const st=G.state;
  if(st==='play'||st==='out'||st==='setpiece'||st==='kickoff'||st==='goal'){
    if(!B.owner)predict();
    for(const e of G.ents){if(!e.team)continue;if(!B.owner){const ip=interceptPt(e);e.ipx=ip.x;e.ipz=ip.z;e.ipt=ip.t;}else{e.ipt=9;}}
    const userPhase=st==='play'||st==='setpiece'||st==='kickoff';
    if(userPhase)lockActive();else G.lock=null;
    for(const t of G.teams)teamThink(t,dt);
    for(const e of G.ents){
      if(!e.team)continue;
      const userDriven=userPhase&&e===G.ctrl&&!G.lock&&!(st==='setpiece'&&G.sp&&G.sp.taker===e&&!G.sp.ready);
      if(!userDriven)think(e,dt);
    }
    if(userPhase)userStep(dt);
    refThink(G.ref);
    for(const e of G.ents)moveEnt(e,dt);
    separate();
    updateBall(dt);
    checkRules();
    if(st==='play'||st==='out'||st==='setpiece'){
      G.clock+=dt*45/(LENS[G.set.len].m*30);
      const poss=B.owner?B.owner.team.i:B.lastTeam;if(poss>=0)G.stats[poss].poss+=dt;
    }
    if(st==='out'){G.timer+=dt;if(G.timer>1.0)startSetpiece();}
    else if(st==='setpiece')setpieceStep(dt);
    else if(st==='kickoff'){G.timer+=dt;if(G.timer>0.6&&!G.kickReady){G.kickReady=true;if(G.teams[G.kickTeam].human)sfx.whistle(0);}if(!G.teams[G.kickTeam].human&&G.timer>1.4)doKickoff();}
    else if(st==='goal'){G.timer+=dt;if(G.timer>3.4)startReplay();}
    const lim=G.half===1?45:90;
    if(G.clock>=lim&&(st==='play'||st==='out'||st==='setpiece')){G.clock=lim;if(G.half===1)halfTime();else fullTime();}
    if(st!=='kickoff'&&(st!=='goal'||recW<(G.goal?G.goal.recEnd:0)))record();
    // excitement
    const att=Math.abs(B.x)/HL;AU.excite(att>0.62?0.35+att*0.25:0.2);
  }
}
function interceptPt(e){
  const sp=e.vmax*0.82,react=0.22,hmax=e.isGK?2.4:1.05;
  for(let i=0;i<=60;i++){const t=i*0.05,bx=TRAJ[i*3],by=TRAJ[i*3+1],bz=TRAJ[i*3+2];
    if(by>hmax)continue;
    const d=hyp(bx-e.x,bz-e.z)-0.3;
    if(d<=sp*Math.max(0,t-react))return{x:bx,z:bz,t};}
  const bx=TRAJ[180],bz=TRAJ[182];return{x:bx,z:bz,t:3+hyp(bx-e.x,bz-e.z)/sp};
}

/* ================= replay ================= */
const REC_N=320,REC_E=12,REC_F=3+23*REC_E,REC=new Float32Array(REC_N*REC_F);let recW=0,recN=0,recTick=0;
function record(){
  if((recTick++)&1)return;
  const o=(recW%REC_N)*REC_F;REC[o]=B.x;REC[o+1]=B.y;REC[o+2]=B.z;let k=o+3;
  for(const e of G.ents){REC[k++]=e.x;REC[k++]=e.z;REC[k++]=e.face;REC[k++]=e.vx;REC[k++]=e.vz;REC[k++]=e.phase;REC[k++]=e.act;REC[k++]=e.actT;REC[k++]=e.actD||0;REC[k++]=e.ap1||0;REC[k++]=e.ap2||0;REC[k++]=e.ap3||0;}
  recW++;recN=Math.min(recN+1,REC_N);

function replayFrame(dt){

  let ka=a+3,kb=b+3;
  for(const e of G.ents){
    e.x=lerp(REC[ka],REC[kb],u);e.z=lerp(REC[ka+1],REC[kb+1],u);e.face=REC[ka+2]+angD(REC[ka+2],REC[kb+2])*u;
    e.vx=lerp(REC[ka+3],REC[kb+3],u);e.vz=lerp(REC[ka+4],REC[kb+4],u);e.speed=hyp(e.vx,e.vz);e.phase=lerp(REC[ka+5],REC[kb+5],u);

function updateCam(dt){
  const st=G.state;
  if(st==='menu'||st==='boot'){
    G.menuT+=dt;const a=G.menuT*0.06+0.5;

  }
  if(st==='intro'){
    G.introT+=dt;const u=clamp(G.introT/3.4,0,1),e=u*u*(3-2*u);
    const p0=new THREE.Vector3(-HL-30,46,72),p1=new THREE.Vector3(10,30,64),p2=new THREE.Vector3(0,CAMS[G.set.cam].h,CAMS[G.set.cam].b);
    camPos.copy(p0).multiplyScalar((1-e)*(1-e)).addScaledVector(p1,2*e*(1-e)).addScaledVector(p2,e*e);
    camLook.set(0,0,lerp(0,-1.5,e));setFov(lerp(40,CAMS[G.set.cam].f,e));

    return;
  }
  if(st==='replay'){
    const s=RP.side;
    tmpV.set(s*(HL+11),4.2,clamp(B.z*0.35,-8,8)+(B.z>0?-3:3));
    RP.cam.lerp(tmpV,1-Math.exp(-dt*3));if(RP.cam.lengthSq()<1)RP.cam.copy(tmpV);
    CAM.position.copy(RP.cam);camLook.lerp(tmpV.set(B.x*0.85+s*HL*0.15,Math.max(0.6,B.y*0.6),B.z),1-Math.exp(-dt*6));CAM.lookAt(camLook);setFov(36);return;
  }
  if(st==='goal'&&G.goal&&G.timer>1.0){
    const sc=G.goal.scorer;
    tmpV.set(sc.x-sc.team.dir*3.5,3.4,sc.z+8.5);
    camPos.lerp(tmpV,1-Math.exp(-dt*2.2));camLook.lerp(tmpV.set(sc.x,1.2,sc.z),1-Math.exp(-dt*4));

const sfx={
  kick(p){if(!AU.ctx)return;const C=AU.ctx,t=C.currentTime,o=C.createOscillator(),g=C.createGain();o.type='sine';o.frequency.setValueAtTime(140+p*3,t);o.frequency.exponentialRampToValueAtTime(48,t+0.09);g.gain.setValueAtTime(clamp(0.12+p*0.018,0.1,0.7),t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+0.15);AU.burst(0.03,2500,0.7,clamp(p*0.012,0.04,0.3));},
  whistle(k){if(!AU.ctx)return;const C=AU.ctx;const blow=(t0,dur)=>{const t=C.currentTime+t0;const o=C.createOscillator(),o2=C.createOscillator(),g=C.createGain(),lfo=C.createOscillator(),lg=C.createGain();o.frequency.value=2850;o2.frequency.value=3020;lfo.frequency.value=32;lg.gain.value=120;lfo.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.02);g.gain.setValueAtTime(0.1,t+dur-0.04);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);o2.connect(g);g.connect(AU.master);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.02);});};
    if(k===2){blow(0,0.35);blow(0.45,0.35);blow(0.9,0.9);}else if(k===1)blow(0,0.5);else blow(0,0.55);},
  post(){if(!AU.ctx)return;const C=AU.ctx,t=C.currentTime;[880,1320,1980].forEach((f,i)=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.18/(i+1),t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.6);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+0.65);});},
  net(){AU.burst(0.3,3500,0.5,0.25,'highpass');},
};

/* ================= input wiring ================= */
// the stick base stays where it is drawn (fixed mode); in free mode it jumps to the thumb on touch-down only
const stick=$('stick'),knob=$('knob'),area=$('stickArea');
const STK={cx:0,cy:0,R:52};
function stickHome(){stick.classList.remove('on');knob.style.transform='';stick.style.left=stick.style.top=stick.style.bottom='';}
function stickMove(x,y){
  const dx=x-STK.cx,dy=y-STK.cy,m=hyp(dx,dy),R=STK.R,mm=Math.min(R,m),a=Math.atan2(dy,dx);
  knob.style.transform='translate('+(Math.cos(a)*mm).toFixed(1)+'px,'+(Math.sin(a)*mm).toFixed(1)+'px)';
  const v=m/R;
  if(v<0.16){IN.jx=IN.jy=0;return;}
  const g=Math.min(1,(v-0.16)/0.7);IN.jx=Math.cos(a)*g;IN.jy=Math.sin(a)*g;
}
area.addEventListener('pointerdown',e=>{
  if(IN.jid!==null)return;IN.jid=e.pointerId;try{area.setPointerCapture(e.pointerId);}catch(_){}
  if(G.set.stick===1){const r0=stick.getBoundingClientRect();stick.style.bottom='auto';stick.style.left=(e.clientX-r0.width/2)+'px';stick.style.top=(e.clientY-r0.height/2)+'px';}
  const r=stick.getBoundingClientRect();STK.cx=r.left+r.width/2;STK.cy=r.top+r.height/2;STK.R=r.width*0.4;
  stick.classList.add('on');stickMove(e.clientX,e.clientY);e.preventDefault();
});
area.addEventListener('pointermove',e=>{if(e.pointerId===IN.jid)stickMove(e.clientX,e.clientY);});
const endStick=e=>{if(e.pointerId!==IN.jid)return;IN.jid=null;IN.jx=IN.jy=0;stickHome();};
area.addEventListener('pointerup',endStick);area.addEventListener('pointercancel',endStick);area.addEventListener('lostpointercapture',endStick);
function btnDown(k){if(IN.btn[k])return;IN.btn[k]=true;if(k==='pass')IN.edge.pass=true;if(k==='thru')IN.edge.thru=true;if(k==='shoot'){IN.edge.shoot=true;IN.charging=userMode()==='atk';IN.shootT=performance.now();IN.power=0;}AU.start();}
function btnUp(k){if(!IN.btn[k])return;IN.btn[k]=false;if(k==='shoot'){if(IN.charging){IN.power=chargePower();IN.edge.shootUp=true;}IN.charging=false;}}
function chargePower(){return clamp((performance.now()-IN.shootT)/850,0.08,1);}
document.querySelectorAll('.bt').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');btnDown(k);});
  const up=e=>{b.classList.remove('on');btnUp(k);};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());});
const KEYMAP={KeyJ:'pass',KeyK:'thru',KeyL:'shoot',Space:'shoot',ShiftLeft:'sprint',ShiftRight:'sprint'};
let usedKeys=false;
addEventListener('keydown',e=>{if(e.repeat)return;usedKeys=true;document.body.classList.remove('nokeys');IN.keys[e.code]=true;if(KEYMAP[e.code]){btnDown(KEYMAP[e.code]);e.preventDefault();}if(e.code==='Escape'||e.code==='KeyP')togglePause();if(e.code==='KeyC')cycleCam();if(G.state==='replay'||G.state==='intro')skipCine();});
addEventListener('keyup',e=>{IN.keys[e.code]=false;if(KEYMAP[e.code])btnUp(KEYMAP[e.code]);});
function keyAxes(){if(IN.jid!==null)return;const K=IN.keys;let x=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),y=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);const m=hyp(x,y);if(m){IN.jx=x/m;IN.jy=y/m;}else if(usedKeys){IN.jx=0;IN.jy=0;}}
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('nokeys');
$('app').addEventListener('pointerdown',()=>{if(G.state==='replay'||G.state==='intro')skipCine();},true);
function skipCine(){if(G.state==='replay')afterReplay();else if(G.state==='intro'){G.introT=3.39;}}
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in IN.btn)IN.btn[k]=false;IN.charging=false;IN.jid=null;IN.jx=IN.jy=0;stickHome();});

/* ================= menu ================= */
function crestHTML(c){const bg=c.pat==='stripe'||c.pat==='pin'?`repeating-linear-gradient(90deg,${c.shirt} 0 5px,${c.pc} 5px 8px)`:c.pat==='hoop'?`repeating-linear-gradient(0deg,${c.shirt} 0 6px,${c.pc} 6px 9px)`:c.pat==='sash'?`linear-gradient(120deg,${c.shirt} 0 40%,${c.pc} 40% 58%,${c.shirt} 58%)`:`linear-gradient(160deg,${c.shirt} 0 55%,${c.pc} 55%)`;return `<span class="crest" style="background:${bg};color:${c.num}">${c.id}</span>`;}
function buildMenu(){
  const mk=(el,key)=>{el.innerHTML=CLUBS.map((c,i)=>`<button class="club" data-i="${i}" aria-pressed="false">${crestHTML(c)}<span>${c.id}</span><em>OVR ${c.rating}</em></button>`).join('');
    el.querySelectorAll('.club').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;const other=key==='home'?'away':'home';if(G.set[other]===i)G.set[other]=G.set[key];G.set[key]=i;syncMenu();menuPreview();}));};
  mk($('clubH'),'home');mk($('clubA'),'away');
  $('segD').innerHTML=DIFFS.map((d,i)=>`<button data-i="${i}">${d.name}</button>`).join('');
  $('segL').innerHTML=LENS.map((d,i)=>`<button data-i="${i}">${d.label}</button>`).join('');
  $('segD').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{G.set.diff=+b.dataset.i;syncMenu();}));
  $('segL').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{G.set.len=+b.dataset.i;syncMenu();}));
  syncMenu();
}
function syncMenu(){
  $('clubH').querySelectorAll('.club').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===G.set.home));
  $('clubA').querySelectorAll('.club').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===G.set.away));
  $('segD').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===G.set.diff));
  $('segL').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===G.set.len));
  const h=CLUBS[G.set.home],a=CLUBS[G.set.away];
  $('vsLine').innerHTML=`<span><b>${h.name}</b> vs <b>${a.name}</b></span><span>전후반 각 ${LENS[G.set.len].m/2}분</span>`;
  const r=getRec();$('rec').textContent='전적 '+r.w+'승 '+r.d+'무 '+r.l+'패';
  lsSet('fl11-set',JSON.stringify(G.set));
}
let previewTimer=null;
function menuPreview(){clearTimeout(previewTimer);previewTimer=setTimeout(()=>{buildTeams();lineup();},60);}
function lineup(){
  // teams lined up for the anthem, facing the main stand
  for(const t of G.teams)t.players.forEach((e,k)=>{e.x=(t.i===0?-1:1)*(1.2+k*1.05);e.z=-2;e.face=0;e.vx=e.vz=0;e.speed=0;e.act=0;});
  G.ref.x=0;G.ref.z=-2;G.ref.face=0;
  B.x=0;B.z=0.6;B.y=BR;B.owner=null;
}
function goMenu(){
  G.state='menu';$('menu').hidden=false;$('hud').hidden=true;$('result').hidden=true;$('pause').hidden=true;$('app').classList.remove('replay');
  bannerOff();hideHint();syncMenu();buildTeams();lineup();
}
$('goBtn').addEventListener('click',()=>{
  AU.start();
  const el=document.documentElement;
  if(matchMedia('(pointer:coarse)').matches&&el.requestFullscreen&&!document.fullscreenElement){el.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}
  startMatch();
});
function togglePause(){
  if(['menu','boot','half','full'].includes(G.state))return;
  G.paused=!G.paused;$('pause').hidden=!G.paused;
  $('pCam').textContent='카메라: '+CAMS[G.set.cam].n;$('pSnd').textContent='사운드: '+(AU.on?'켜짐':'꺼짐');$('pStk').textContent='조이스틱: '+(G.set.stick?'자유':'고정');
  if(AU.ctx){G.paused?AU.ctx.suspend():AU.ctx.resume();}
}
function cycleCam(){G.set.cam=(G.set.cam+1)%CAMS.length;$('camBtn').textContent=CAMS[G.set.cam].n;$('pCam').textContent='카메라: '+CAMS[G.set.cam].n;lsSet('fl11-set',JSON.stringify(G.set));}
$('pauseBtn').addEventListener('click',togglePause);
$('camBtn').addEventListener('click',cycleCam);
$('pause').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
  if(a==='resume')togglePause();
  if(a==='cam')cycleCam();
  if(a==='stick'){G.set.stick=G.set.stick?0:1;$('pStk').textContent='조이스틱: '+(G.set.stick?'자유':'고정');stickHome();lsSet('fl11-set',JSON.stringify(G.set));}
  if(a==='snd'){AU.setOn(!AU.on);$('pSnd').textContent='사운드: '+(AU.on?'켜짐':'꺼짐');}
  if(a==='restart'){G.paused=false;$('pause').hidden=true;if(AU.ctx)AU.ctx.resume();startMatch();}
  if(a==='menu'){G.paused=false;$('pause').hidden=true;if(AU.ctx)AU.ctx.resume();goMenu();}
});
$('rMain').addEventListener('click',()=>{
  if(G.state==='half'){$('result').hidden=true;G.half=2;G.clock=45;G.kickTeam=1-G.firstKick;resetKickoff(G.kickTeam);G.state='kickoff';G.kickReady=false;banner('2ND HALF','후반전 시작',1600);}
  else startMatch();
});
$('rAlt').addEventListener('click',goMenu);
$('rotSkip').addEventListener('click',()=>{G.portraitOK=true;checkOrient();});

/* ================= resize / orientation ================= */
function resize(){
  const w=innerWidth,h=innerHeight;R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix();camFov=0;
  const sc=clamp(Math.min(w/740,h/360),0.82,1.25);$('pad').style.transform='scale('+sc+')';$('pad').style.transformOrigin='100% 100%';
  stickHome();checkOrient();
}
function checkOrient(){
  const portrait=innerHeight>innerWidth*1.05&&matchMedia('(pointer:coarse)').matches;
  $('rotate').hidden=!(portrait&&!G.portraitOK);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));

/* ================= loop ================= */
let last=performance.now(),acc=0,fpsAcc=0,fpsN=0,fpsCheck=0;
const STEP=1/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!$('rotate').hidden){R.render(S,CAM);return;}
  if(!G.paused){
    keyAxes();
    if(IN.charging)IN.power=chargePower();
    if(G.state==='replay'){replayFrame(dt);}
    else if(G.state==='menu'||G.state==='boot'){G.t+=dt;for(const e of G.ents){e.speed=0;}}
    else if(G.state==='intro'){G.t+=dt;}
    else if(G.state!=='half'&&G.state!=='full'){acc+=dt;let n=0;while(acc>=STEP&&n<4){step(STEP);acc-=STEP;n++;}if(n>=4)acc=0;}
    updateCam(dt);
    updateVisuals(dt);
    if(G.state!=='menu'&&G.state!=='boot')hudFrame();
  }
  R.render(S,CAM);
  // adaptive resolution
  fpsAcc+=dt;fpsN++;fpsCheck+=dt;
  if(fpsCheck>2.5){const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;fpsCheck=0;if(avg>0.024&&PR>1){PR=Math.max(1,PR-0.25);R.setPixelRatio(PR);resize();}}
}

/* ================= boot ================= */
function boot(data){
  try{const s=JSON.parse(lsGet('fl11-set')||'null');if(s&&CLUBS[s.home]&&CLUBS[s.away]&&s.home!==s.away){G.set.home=s.home;G.set.away=s.away;G.set.diff=clamp(s.diff|0,0,2);G.set.len=clamp(s.len|0,0,2);G.set.cam=clamp(s.cam|0,0,2);G.set.stick=s.stick===1?1:0;}}catch(e){}
  if(data&&data.set){Object.assign(G.set,data.set);}
  $('camBtn').textContent=CAMS[G.set.cam].n;
  buildStands();buildBoards();buildFloods();
  buildMenu();resize();
  goMenu();
  $('loading').hidden=true;
  if(data&&data.inMatch){startMatch();G.score=data.score||[0,0];G.clock=data.clock||0;G.half=data.half||1;hudScore();}
  requestAnimationFrame(t=>{last=t;frame(t);});
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({set:G.set,inMatch:!['menu','boot','full'].includes(G.state),score:G.score,clock:G.clock,half:G.half}));}catch(e){}
const startBoot=()=>{const h=window.claude&&window.claude.hot;if(h&&h.ready)h.ready(boot);else boot(h&&h.data||{});};
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(startBoot);
window.__G=G;window.__B=B;
})();
</script>
